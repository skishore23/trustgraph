<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TrustGraph operator</title>
<link rel="stylesheet" href="/serve.css">
<script src="/serve.js" defer></script>
</head>
<body>
<main>
<h1>TrustGraph</h1>
<p id="who">Connecting.</p>
<p id="notice" class="notice" hidden></p>
<p id="clock" class="notice" hidden>The system clock is behind the journal. Approvals are refused until it catches up; everything else works.</p>

<div id="signed-in" hidden>
<p><a href="/" id="refresh">Refresh</a> <span class="muted">(updates every few seconds)</span> <a href="/" id="updated" class="muted" hidden>updated — refresh</a></p>

<div id="lists">
<h2>Waiting for approval</h2>
<div id="pending"></div>

<h2>Approved</h2>
<div id="approvals"></div>

<h2>Proposed policies</h2>
<div id="proposals"></div>

<div id="gateway" hidden>
<h2>Sessions</h2>
<div id="gateway-problems"></div>
<div id="sessions"></div>
<h2>Open connections</h2>
<div id="connections"></div>
</div>
</div>
</div>
</main>
</body>
</html>
