[package]
name = "trustgraph-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "hosted/lib.rs"

[[bin]]
name = "policy"
path = "api/policy.rs"

[[bin]]
name = "mcp"
path = "api/mcp.rs"

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
trustgraph-runtime = { path = "crates/trustgraph-runtime" }
trustgraph-sim = { path = "crates/trustgraph-sim" }
trustgraph-policy = { path = "crates/trustgraph-policy" }
vercel_runtime = { version = "2.4", features = ["axum"] }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-streamable-http-server"] }

[workspace]
members = ["crates/*", "examples/integrations/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
proptest = "1"
fs2 = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# The journal and digests hash constantly; unoptimized SHA-256 dominates
# debug test time (notably the policy simulator). Dev builds only.
[profile.dev.package.sha2]
opt-level = 3
