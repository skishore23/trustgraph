name: Rust workspace
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint all workspace targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build fake MCP servers
        run: cargo build --locked -p trustgraph-cli --examples
      - name: Test the full workspace, including real MCP gateway forwarding
        run: cargo test --locked --workspace --all-targets
      - name: Reproduce the protected demo
        run: ./examples/typed-gateway/run.sh
