[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trustgraph-sdk"
version = "0.1.0"
license = "MIT"
description = "Python client and agent-framework integrations for TrustGraph serve"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Lower bounds are the versions the tests ran against (docs/integrations.md).
langchain = ["langchain>=1.5.0,<2", "langchain-core>=1.8.1,<2", "langgraph>=1.2.22,<2"]
openai-agents = ["openai-agents>=0.24.0,<1"]
claude-agent-sdk = ["claude-agent-sdk>=0.2.182,<1"]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/trustgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
