[package]
name = "trustgraph-cli"
description = "The trustgraph command: write, check and test a policy, serve it to agents over HTTP and MCP, and gate their MCP servers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[[bin]]
name = "trustgraph"
path = "src/main.rs"
[dependencies]
trustgraph-sim = { path = "../trustgraph-sim" }
trustgraph-policy = { path = "../trustgraph-policy" }
# No features: the shipped CLI never links the engine's fault injection.
trustgraph-engine = { path = "../trustgraph-engine" }
sha2.workspace = true
getrandom = "0.4"
http-body-util = "0.1"
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
axum.workspace = true
# The gateway is also an MCP client: of upstream servers over streamable
# HTTP (rustls) or a child process's stdio, and, in `gateway stdio`, of itself.
rmcp = { version = "=3.10.0", default-features = false, features = [
    "server",
    "client",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "transport-child-process",
    "transport-io",
] }
serde_yaml = "0.9"
[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW / O_NONBLOCK for token and launch files.
libc = "0.2"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile.workspace = true
