[package]
name = "trustgraph-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[[bin]]
name = "trustgraph"
path = "src/main.rs"
[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
uuid = { version = "1", features = ["v4"] }
trustgraph-live = { path = "../trustgraph-live" }
trustgraph-core = { path = "../trustgraph-core" }
trustgraph-runtime = { path = "../trustgraph-runtime" }
trustgraph-sim = { path = "../trustgraph-sim" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
axum.workspace = true
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server"] }
mcp-http = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream"] }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest.workspace = true
tempfile.workspace = true
tokio-stream = "0.1"
