[package]
name = "trustgraph-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Deliberate engine bugs (`Fault`) for the simulator. Never enable in a
# production build: one fault answers `Check` without `decide`.
fault-injection = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
fs2.workspace = true
thiserror.workspace = true
trustgraph-core = { path = "../trustgraph-core" }
trustgraph-framework = { path = "../trustgraph-framework" }
trustgraph-policy = { path = "../trustgraph-policy" }

[dev-dependencies]
# The crate's own tests also exercise the injected faults.
trustgraph-engine = { path = ".", features = ["fault-injection"] }
tempfile.workspace = true
