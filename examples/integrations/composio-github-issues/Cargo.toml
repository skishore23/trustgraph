[package]
name = "trustgraph-composio-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "trustgraph-composio-issues"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
trustgraph-core = { path = "../../../crates/trustgraph-core" }
trustgraph-live = { path = "../../../crates/trustgraph-live" }
trustgraph-runtime = { path = "../../../crates/trustgraph-runtime" }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
