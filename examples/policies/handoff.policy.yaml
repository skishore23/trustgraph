# Scenario: a research agent reads the salary file and writes planning notes; a planning agent combines the notes with the roadmap.
# What the notes carry follows them, so a summary built on them stays HR-only however many steps later.
version: 1

groups:
  hr: [nina]
  engineering: [sam, ravi]
  leadership: [maya]

agents: [researcher, planner]

sources:
  salaries:           # compensation: HR only
    readers: [hr]
    agents: [researcher, planner]
  roadmap:            # product plans: HR, engineering and leadership
    readers: [hr, engineering, leadership]
    agents: [planner]
  benchmarks:         # public industry data
    readers: [hr, engineering, leadership]
    agents: [researcher, planner]

actions:
  post_to_engineering:
    agents: [planner]
    audience: [engineering]
  brief_hr:
    agents: [planner]
    audience: [hr]
  brief_leadership:   # leadership sees plans only after HR signs off
    agents: [planner]
    audience: [leadership]
    approval: { reviewers: [hr], valid_for: 1h }

# Tests list every source an output carries, including through notes.
tests:
  - name: a summary built on salary notes never reaches engineering
    output_from: [salaries, roadmap]
    agent: planner
    action: post_to_engineering
    expect: deny
  - name: a roadmap summary can go to engineering
    output_from: [roadmap]
    agent: planner
    action: post_to_engineering
    expect: allow
  - name: the same summary can brief HR
    output_from: [salaries, roadmap]
    agent: planner
    action: brief_hr
    expect: allow
  - name: leadership gets the roadmap after HR approves
    output_from: [roadmap, benchmarks]
    agent: planner
    action: brief_leadership
    expect: needs_approval
  - name: salary notes never reach leadership, even with approval
    output_from: [salaries, benchmarks]
    agent: planner
    action: brief_leadership
    expect: deny
