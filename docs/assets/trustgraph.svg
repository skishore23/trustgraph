<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">TrustGraph: new outputs, same obligations</title><desc id="desc">Two sources feed a typed transformation. Their permitted readers intersect, so the generated output remains restricted to Finance.</desc>
<rect width="1200" height="400" rx="16" fill="#f3f5f8"/>
<g font-family="Arial,sans-serif" fill="#15243e"><text x="48" y="66" font-size="25" font-weight="700">TrustGraph</text><text x="48" y="119" font-size="38" font-weight="700">New outputs. Same obligations.</text><text x="48" y="155" font-size="17" fill="#56657b">Typed dataflow with permission-preserving transformations.</text></g>
<g stroke="#8a9db9" stroke-width="2" fill="none"><path d="M300 241H380V286H460"/><path d="M300 331H380V286"/><path d="M702 286H790"/></g><path d="M780 280l10 6-10 6" fill="none" stroke="#8a9db9" stroke-width="2"/>
<g font-family="Arial,sans-serif"><rect x="48" y="205" width="252" height="72" rx="6" fill="white" stroke="#b9c6d9"/><text x="67" y="233" font-size="17" font-weight="600" fill="#15243e">Price sheet</text><text x="67" y="256" font-size="13" fill="#56657b">Readers: Sales, Finance</text><rect x="48" y="295" width="252" height="72" rx="6" fill="white" stroke="#b9c6d9"/><text x="67" y="323" font-size="17" font-weight="600" fill="#15243e">Customer contract</text><text x="67" y="346" font-size="13" fill="#56657b">Readers: Finance</text><rect x="460" y="246" width="242" height="80" rx="22" fill="#245ada"/><text x="483" y="277" font-size="18" font-weight="600" fill="white">create_quote@1</text><text x="483" y="301" font-size="13" fill="#e2eaff">Named, typed input / output ports</text><rect x="790" y="246" width="350" height="80" rx="6" fill="white" stroke="#176a4f" stroke-width="2"/><text x="810" y="277" font-size="18" font-weight="600" fill="#15243e">Quote</text><text x="810" y="302" font-size="14" fill="#176a4f">Readers: Finance</text><text x="790" y="354" font-size="12" fill="#56657b">Source restrictions survive the transformation.</text></g>
</svg>
